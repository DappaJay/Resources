<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Finance Function Check | CBA</title>
<meta name="description" content="A 2-minute quick check on your finance function, with an instant result.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F3;
    --surface:#FFFFFF;
    --ink:#132A3A;
    --ink-soft:#516475;
    --ink-faint:#8695A2;
    --accent:#0E7C66;
    --accent-dark:#0A5E4D;
    --accent-soft:#DCEEE9;
    --line:#D7DCE0;
    --amber:#B8792E;
    --danger:#B3432E;
    --radius:14px;
    --shadow: 0 1px 2px rgba(19,42,58,0.04), 0 8px 24px rgba(19,42,58,0.06);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    background-image:linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 32px;
    background-attachment:local;
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 16px 80px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  .app{width:100%; max-width:680px;}
  .brand{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:28px;}
  .brand-mark{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .brand-mark strong{color:var(--ink);}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 32px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--accent-dark);
    margin:0 0 8px;
  }
  h1,h2{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    margin:0 0 4px;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  h1{font-size:28px;}
  h2{font-size:24px;}
  .intro-copy{color:var(--ink-soft); font-size:15px; margin:14px 0 0;}

  .question{margin-bottom:30px;}
  .question:last-child{margin-bottom:0;}
  .q-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--ink-faint);
    display:block; margin-bottom:6px;
  }
  .q-text{font-size:16px; font-weight:500; color:var(--ink); margin:0 0 14px; line-height:1.45;}
  .options{display:flex; flex-direction:column; gap:8px;}
  .opt{
    display:flex; align-items:flex-start; gap:12px;
    padding:13px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt:hover{border-color:var(--accent);}
  .opt input{margin-top:3px; accent-color:var(--accent); width:16px; height:16px; flex-shrink:0;}
  .opt.checked{border-color:var(--accent); background:var(--accent-soft);}
  .opt.na{border-style:dashed;}
  .opt.na span{color:var(--ink-soft); font-style:italic;}
  .opt span{font-size:14.5px; color:var(--ink); line-height:1.4;}

  .nav{display:flex; justify-content:flex-end; align-items:center; margin-top:8px;}
  button{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px; font-weight:600;
    border-radius:9px; padding:12px 22px;
    cursor:pointer; border:1px solid transparent;
    transition: opacity .15s ease, transform .1s ease;
  }
  button:active{transform:scale(0.98);}
  button:focus-visible{outline:3px solid var(--amber); outline-offset:2px;}
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn-primary:disabled{background:var(--ink-faint); border-color:var(--ink-faint); cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft); color:var(--ink);}

  .hint{font-size:13px; color:var(--ink-faint); margin-top:10px; text-align:right;}

  /* Result view */
  .result-score{
    display:flex; align-items:baseline; gap:12px; margin:18px 0 6px;
  }
  .result-score .num{
    font-family:'Fraunces', Georgia, serif;
    font-size:56px; font-weight:600; color:var(--accent-dark); line-height:1;
  }
  .result-score .of{font-size:16px; color:var(--ink-faint);}
  .band-pill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
    background:var(--accent-soft); color:var(--accent-dark);
    padding:5px 12px; border-radius:20px;
    margin-bottom:18px;
  }
  .signal-row{display:flex; flex-direction:column; gap:10px; margin:20px 0 24px;}
  .signal{
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .signal .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink-faint); display:block; margin-bottom:4px;
  }
  .signal .title{font-size:15px; font-weight:600; color:var(--ink);}
  .signal .pct{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .signal.strong{border-color:var(--accent); background:var(--accent-soft);}
  .signal.weak{border-color:var(--danger); background:#FBEAE6;}

  .band-copy{font-size:15px; color:var(--ink-soft); line-height:1.6; margin:0 0 8px;}

  .coverage-note{
    font-size:13px; color:var(--ink-faint);
    border-top:1px solid var(--line);
    margin-top:24px; padding-top:16px; line-height:1.6;
  }

  .cta-row{display:flex; flex-direction:column; gap:12px; margin-top:24px;}
  .cta{
    display:block;
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    text-decoration:none;
    transition: border-color .15s ease, background .15s ease;
  }
  .cta:hover{border-color:var(--accent);}
  .cta.primary{background:var(--accent); border-color:var(--accent);}
  .cta.primary .cta-title{color:#fff;}
  .cta.primary .cta-sub{color:rgba(255,255,255,0.85);}
  .cta-title{
    font-family:'Fraunces', Georgia, serif;
    font-size:18px; font-weight:600; color:var(--ink); display:block; margin-bottom:4px;
  }
  .cta-sub{font-size:13.5px; color:var(--ink-soft); line-height:1.45;}

  @media (max-width:600px){
    .card{padding:26px 20px;}
    h1{font-size:23px;}
    h2{font-size:20px;}
    body{padding:24px 12px 60px;}
    .result-score .num{font-size:44px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="brand-mark"><strong>CBA</strong> / Quick Finance Check</div>
  </div>
  <div class="card" id="card"></div>
</div>

<script>
/* ===================================================================
   CONFIG
   =================================================================== */
const FULL_TOOL_URL = "finance_health_check.html";
const CONTACT_EMAIL = "info@cathybrownadvisory.co.uk";

/* ===================================================================
   QUESTION DATA
   10 questions pulled directly from the full 44-question tool - same
   ids, same text, same options, same score values (0 / 0.5 / 1) as
   make_scoring_module.js's SCORE_TABLE. Covers 10 of the 12 sections
   (90 of the 100 weighted points); Headcount & Capacity and Finance
   Team Capability & Resilience are not represented in this short
   version and are called out explicitly in the result screen.
   =================================================================== */
const QUESTIONS = [
  {
    id: "q1", sectionId: 1, sectionTitle: "Close Cycle and Reporting Speed", weight: 14,
    text: "How many working days after month-end does your finance team typically deliver finalised management accounts to the leadership team?",
    options: [
      { text: "Within 5 working days", score: 1 },
      { text: "6-10 working days", score: 0.5 },
      { text: "More than 10 working days, or no fixed deadline", score: 0 }
    ]
  },
  {
    id: "q5", sectionId: 2, sectionTitle: "Finance Systems and Technology", weight: 14,
    text: "What best describes your accounting system and how well it fits your current business complexity?",
    options: [
      { text: "System is fit for purpose for current complexity and produces reliable, timely output", score: 1 },
      { text: "System is workable but starting to strain - manual effort is high, or there are known gaps with no clear roadmap to address them", score: 0.5 },
      { text: "System is not fit for purpose - legacy, on-premise, or unable to produce reliable output; or no formal accounting system in place", score: 0 }
    ]
  },
  {
    id: "q10", sectionId: 3, sectionTitle: "Controls and Audit Readiness", weight: 14,
    text: "If you were asked to begin an external audit or investor due diligence process tomorrow, how long would it take to be ready?",
    options: [
      { text: "We could be ready to begin within 2 weeks without significant disruption to BAU", score: 1 },
      { text: "We could be ready within 4-8 weeks with some effort and reprioritisation", score: 0.5 },
      { text: "It would take more than 2 months of preparation, or we have never considered this", score: 0 }
    ]
  },
  {
    id: "q13", sectionId: 4, sectionTitle: "Data Quality and Integrity", weight: 14,
    text: "How confident are you in the accuracy and completeness of the data held in your accounting system?",
    options: [
      { text: "High confidence - data is clean, reconciled, and trusted by leadership without challenge", score: 1 },
      { text: "Moderate confidence - some known issues exist but data is broadly reliable for decisions", score: 0.5 },
      { text: "Low confidence - data has known material errors or is regularly questioned in meetings", score: 0 }
    ]
  },
  {
    id: "q17", sectionId: 5, sectionTitle: "Corporate Activity and Complexity", weight: 6,
    text: "Are all entities in your group fully integrated into your consolidated financial reporting?",
    options: [
      { text: "Not applicable - we operate as a single legal entity", score: null },
      { text: "All entities are fully integrated into consolidated reporting", score: 1 },
      { text: "Most entities are integrated; 1-2 are reported separately or with a consistent lag", score: 0.5 },
      { text: "Multiple entities are excluded from or only partially included in consolidated reporting", score: 0 }
    ]
  },
  {
    id: "q21", sectionId: 6, sectionTitle: "Cashflow Forecasting", weight: 7,
    text: "How far ahead does your cash flow forecast typically run?",
    options: [
      { text: "13 weeks or more on a rolling basis", score: 1 },
      { text: "Monthly for the next 3-6 months", score: 0.5 },
      { text: "Less than 4 weeks ahead, entirely reactive, or no formal forecast exists", score: 0 }
    ]
  },
  {
    id: "q25", sectionId: 7, sectionTitle: "P&L Budgeting and Forecasting", weight: 7,
    text: "Does your business have a formally approved P&L budget for the current financial year, signed off by the board or ownership before the year begins?",
    options: [
      { text: "Yes - formally approved by the board/owners before the year starts, with entity and/or departmental-level detail", score: 1 },
      { text: "An internal budget exists but is not formally board-approved, is high-level only, or was finalised after the year had already started", score: 0.5 },
      { text: "No formal P&L budget exists", score: 0 }
    ]
  },
  {
    id: "q29", sectionId: 8, sectionTitle: "Board and Management Reporting Quality", weight: 7,
    text: "Does your standard board pack include all four core financial elements - P&L, balance sheet, cash flow statement, and a key financial metrics and performance summary - delivered at every board meeting?",
    options: [
      { text: "Yes - all four elements are included consistently at every board meeting", score: 1 },
      { text: "Yes - but one or more elements is regularly incomplete, missing, or delivered late", score: 0.5 },
      { text: "No - board financial reporting is partial, ad hoc, or not consistently produced", score: 0 }
    ]
  },
  {
    id: "q33", sectionId: 9, sectionTitle: "Finance Function Structure", weight: 5,
    text: "Which of the following functions sit within, or are directly managed by, your finance function with clear named ownership? (Tax, Payroll, Statutory reporting, Forecasting / FP&A, Treasury / cash management)",
    options: [
      { text: "4 or 5 of these functions sit within finance with clear, named ownership", score: 1 },
      { text: "2-3 functions have clear ownership; others are managed informally or sit outside finance", score: 0.5 },
      { text: "Fewer than 2 of these are formally owned by finance, or ownership is unclear across the board", score: 0 }
    ]
  },
  {
    id: "q44", sectionId: 12, sectionTitle: "AI and Automation Maturity", weight: 2,
    text: "How would you describe the finance team's general attitude towards adopting new technology and automation?",
    options: [
      { text: "Proactive - finance actively seeks, evaluates, and adopts new tools with appropriate governance and review discipline", score: 1 },
      { text: "Willing but reactive - team adopts tools when directed or when others introduce them, but does not drive it", score: 0.5 },
      { text: "Resistant - there is significant pushback against new tools, or technology change is avoided", score: 0 }
    ]
  }
];

const TOTAL_WEIGHT = QUESTIONS.reduce((sum, q) => sum + q.weight, 0); // 90

/* Same band thresholds and labels as the full 44-question tool */
const BANDS = [
  { max: 40, label: "Needs Significant Attention" },
  { max: 60, label: "Developing" },
  { max: 80, label: "Functional" },
  { max: 101, label: "Strong" },
];
function getBand(score){ return BANDS.find(b => score < b.max).label; }

const BAND_COPY = {
  "Needs Significant Attention": "That's a clear signal rather than a surprise dressed up in nice language. A score this low usually means the finance function needs structural work, not tweaks.",
  "Developing": "There are real building blocks in place, but several areas are still reactive rather than under control. Worth working through properly.",
  "Functional": "This is a reasonably solid base to build from, with specific gaps worth closing before they become bigger problems.",
  "Strong": "This is a well-run finance function on the areas covered here. Worth checking the areas this quick version doesn't reach."
};

/* ===================================================================
   STATE
   =================================================================== */
const answers = {}; // { q1: score, q5: score, ... }

/* ===================================================================
   RENDER: QUESTIONS
   =================================================================== */
function allAnswered(){
  return QUESTIONS.every(q => answers[q.id] !== undefined);
}

function renderQuestions(){
  const card = document.getElementById('card');
  card.innerHTML = '';

  const eyebrow = document.createElement('p');
  eyebrow.className = 'eyebrow';
  eyebrow.textContent = 'Quick check - 2 minutes';
  card.appendChild(eyebrow);

  const h = document.createElement('h1');
  h.textContent = "How's your finance function doing?";
  card.appendChild(h);

  const intro = document.createElement('p');
  intro.className = 'intro-copy';
  intro.textContent = '10 quick questions, no email required. Answer honestly, based on how things actually work today, and see your result straight away.';
  card.appendChild(intro);

  QUESTIONS.forEach((q, i) => {
    const block = document.createElement('div');
    block.className = 'question';
    block.style.marginTop = '30px';

    const num = document.createElement('span');
    num.className = 'q-num';
    num.textContent = `Q${i + 1} of ${QUESTIONS.length}`;
    block.appendChild(num);

    const text = document.createElement('p');
    text.className = 'q-text';
    text.textContent = q.text;
    block.appendChild(text);

    const optsWrap = document.createElement('div');
    optsWrap.className = 'options';
    q.options.forEach(opt => {
      const isNA = opt.text.startsWith('Not applicable');
      const wrap = document.createElement('label');
      wrap.className = 'opt' + (isNA ? ' na' : '') + (answers[q.id] === opt.score ? ' checked' : '');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = q.id;
      input.value = opt.score;
      if (answers[q.id] === opt.score) input.checked = true;
      input.addEventListener('change', () => {
        answers[q.id] = opt.score;
        renderQuestions();
      });
      const span = document.createElement('span');
      span.textContent = opt.text;
      wrap.appendChild(input);
      wrap.appendChild(span);
      optsWrap.appendChild(wrap);
    });
    block.appendChild(optsWrap);
    card.appendChild(block);
  });

  const nav = document.createElement('div');
  nav.className = 'nav';
  nav.style.marginTop = '32px';

  const submit = document.createElement('button');
  submit.className = 'btn-primary';
  submit.textContent = 'See my result';
  submit.disabled = !allAnswered();
  submit.addEventListener('click', () => {
    renderResult();
    window.scrollTo({top:0, behavior:'smooth'});
  });
  nav.appendChild(submit);
  card.appendChild(nav);

  if (!allAnswered()){
    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = 'Answer all 10 questions to see your result.';
    card.appendChild(hint);
  }
}

/* ===================================================================
   SCORING
   =================================================================== */
function computeResult(){
  let weightedSum = 0;
  let weightUsed = 0;
  const sectionResults = [];

  QUESTIONS.forEach(q => {
    const score = answers[q.id];
    if (score === null) return; // Not applicable - excluded entirely, same as the full tool
    const scorePct = score * 100;
    weightedSum += q.weight * scorePct;
    weightUsed += q.weight;
    sectionResults.push({ title: q.sectionTitle, weight: q.weight, scorePct });
  });

  const overallScore = weightUsed > 0 ? Math.round(weightedSum / weightUsed) : 0;
  const band = getBand(overallScore);

  const sorted = [...sectionResults].sort((a, b) => b.scorePct - a.scorePct);
  const strongest = sorted[0];
  const weakest = sorted[sorted.length - 1];

  return { overallScore, band, strongest, weakest };
}

/* ===================================================================
   RENDER: RESULT
   =================================================================== */
function renderResult(){
  const result = computeResult();
  const card = document.getElementById('card');
  card.innerHTML = '';

  const eyebrow = document.createElement('p');
  eyebrow.className = 'eyebrow';
  eyebrow.textContent = 'Your quick result';
  card.appendChild(eyebrow);

  const h = document.createElement('h2');
  h.textContent = 'Here\'s where you stand';
  card.appendChild(h);

  const scoreRow = document.createElement('div');
  scoreRow.className = 'result-score';
  scoreRow.innerHTML = `<span class="num">${result.overallScore}</span><span class="of">/ 100</span>`;
  card.appendChild(scoreRow);

  const pill = document.createElement('span');
  pill.className = 'band-pill';
  pill.textContent = result.band;
  card.appendChild(pill);

  const bandCopy = document.createElement('p');
  bandCopy.className = 'band-copy';
  bandCopy.textContent = BAND_COPY[result.band];
  card.appendChild(bandCopy);

  const signalRow = document.createElement('div');
  signalRow.className = 'signal-row';

  const strongSignal = document.createElement('div');
  strongSignal.className = 'signal strong';
  strongSignal.innerHTML = `<span class="label">Strongest area</span><span class="title">${result.strongest.title}</span><span class="pct">${Math.round(result.strongest.scorePct)}%</span>`;
  signalRow.appendChild(strongSignal);

  const weakSignal = document.createElement('div');
  weakSignal.className = 'signal weak';
  weakSignal.innerHTML = `<span class="label">Area to prioritise</span><span class="title">${result.weakest.title}</span><span class="pct">${Math.round(result.weakest.scorePct)}%</span>`;
  signalRow.appendChild(weakSignal);

  card.appendChild(signalRow);

  const coverage = document.createElement('p');
  coverage.className = 'coverage-note';
  coverage.textContent = 'This quick version covers 10 of the 12 areas the full check looks at. It doesn\'t yet touch team capacity or headcount resilience - the full check does, along with a written, personalised assessment.';
  card.appendChild(coverage);

  const ctaRow = document.createElement('div');
  ctaRow.className = 'cta-row';

  const fullLink = document.createElement('a');
  fullLink.className = 'cta primary';
  fullLink.href = FULL_TOOL_URL;
  fullLink.innerHTML = `<span class="cta-title">Get the full picture</span><span class="cta-sub">44 questions, all 12 areas, and a personalised written assessment sent to your inbox.</span>`;
  ctaRow.appendChild(fullLink);

  const subject = encodeURIComponent('Finance Function Quick Check - let\'s talk');
  const body = encodeURIComponent(`Hi Cathy,\n\nI took the quick Finance Function Check and scored ${result.overallScore}/100 (${result.band}). I'd like to talk it through.\n\n`);
  const emailLink = document.createElement('a');
  emailLink.className = 'cta';
  emailLink.href = `mailto:${CONTACT_EMAIL}?subject=${subject}&body=${body}`;
  emailLink.innerHTML = `<span class="cta-title">Email me instead</span><span class="cta-sub">Prefer to just talk it through? Send a quick email and I'll reply to arrange a time.</span>`;
  ctaRow.appendChild(emailLink);

  card.appendChild(ctaRow);

  const back = document.createElement('button');
  back.className = 'btn-ghost';
  back.textContent = 'Answer again';
  back.style.marginTop = '20px';
  back.addEventListener('click', () => { renderQuestions(); window.scrollTo({top:0, behavior:'smooth'}); });
  card.appendChild(back);
}

renderQuestions();
</script>
</body>
</html>
